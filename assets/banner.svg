<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Virtual Phone — a full-stack WebRTC softphone on Telnyx">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#0a0a0c"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Left: brand -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="88" y="88" width="336" height="32" rx="16" fill="#141419" stroke="#23232b"/>
    <circle cx="110" cy="104" r="4" fill="#7c3aed"/>
    <text x="126" y="109" font-size="12" font-weight="600" letter-spacing="2.2" fill="#a1a1aa">TELNYX · WEBRTC · REACT · BUN</text>

    <rect x="88" y="152" width="56" height="6" rx="3" fill="#7c3aed"/>

    <text x="86" y="234" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Virtual Phone</text>

    <text x="88" y="282" font-size="20" fill="#a1a1aa">Turn any browser tab into a phone line.</text>
    <text x="88" y="312" font-size="20" fill="#6b7280">Built end-to-end with React, Bun, Express &amp; Telnyx WebRTC.</text>

    <g>
      <rect x="88" y="344" width="96" height="36" rx="18" fill="#141419" stroke="#23232b"/>
      <text x="136" y="367" font-size="13" font-weight="500" fill="#d4d4d8" text-anchor="middle">WebRTC</text>
      <rect x="196" y="344" width="140" height="36" rx="18" fill="#141419" stroke="#23232b"/>
      <text x="266" y="367" font-size="13" font-weight="500" fill="#d4d4d8" text-anchor="middle">Multi-number</text>
      <rect x="348" y="344" width="116" height="36" rx="18" fill="#141419" stroke="#23232b"/>
      <text x="406" y="367" font-size="13" font-weight="500" fill="#d4d4d8" text-anchor="middle">Live cost</text>
    </g>
  </g>

  <!-- Right: phone mock -->
  <g transform="translate(896,40)">
    <rect width="272" height="320" rx="40" fill="#101014" stroke="#23232b" stroke-width="1.5"/>
    <rect x="12" y="12" width="248" height="296" rx="30" fill="#0b0b0e"/>

    <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <!-- status -->
      <circle cx="36" cy="40" r="4" fill="#22c55e"/>
      <text x="48" y="44" font-size="12" fill="#a1a1aa">Ready · +1 555 010 0000</text>

      <!-- caller -->
      <text x="136" y="96" font-size="11" font-weight="600" letter-spacing="2" fill="#6b7280" text-anchor="middle">INCOMING CALL</text>
      <text x="136" y="132" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">+1 555 010 0000</text>

      <!-- on-net quick dial -->
      <rect x="36" y="166" width="200" height="36" rx="12" fill="#141419" stroke="#23232b"/>
      <circle cx="54" cy="184" r="3.5" fill="#22c55e"/>
      <text x="66" y="188" font-size="12" fill="#d4d4d8">+1 555 010 0001</text>

      <!-- buttons -->
      <rect x="36" y="230" width="94" height="52" rx="18" fill="#16161b" stroke="#23232b"/>
      <g transform="translate(71,244) rotate(135 12 12)" fill="#ef4444">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </g>

      <rect x="142" y="230" width="94" height="52" rx="18" fill="#7c3aed"/>
      <g transform="translate(177,244)" fill="#ffffff">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </g>
    </g>
  </g>
</svg>
